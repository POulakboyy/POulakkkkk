[package]
name = "pouxis"
version = "0.1.0"
description = "POuxis native shell (Tauri 2) for macOS, Windows, Linux, iOS and Android."
authors = ["POuxis contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "pouxis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-notification = "2.5.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-deep-link = "2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Desktop-only plugins: global shortcuts, single instance (forwards deep links to the
# running instance on Windows/Linux) and window geometry persistence.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"

# Mobile-only plugin: Taptic Engine (iOS) and Vibrator/HapticFeedback (Android).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Intégration continue : formatage, types, tests unitaires, build web et tests e2e.
# Documentation : docs/operations/CI_CD.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A new push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  verify:
    name: Format, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The suite is optional until apps/pouxis/e2e exists: skip cleanly instead of failing.
      - name: Detect e2e suite
        id: suite
        env:
          E2E_HASH: ${{ hashFiles('apps/pouxis/e2e/**') }}
        run: |
          if [ -n "$E2E_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E ignorés::apps/pouxis/e2e n'existe pas encore."
          fi

      - name: Setup Node.js
        if: steps.suite.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.suite.outputs.present == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.suite.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        if: steps.suite.outputs.present == 'true'
        run: npm run e2e -w @pouxis/app

      - name: Upload Playwright report
        if: failure() && steps.suite.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            apps/pouxis/playwright-report/
            apps/pouxis/test-results/
          if-no-files-found: ignore
          retention-days: 14

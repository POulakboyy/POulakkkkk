# Contrôles du shell natif Tauri (Rust) : formatage, Clippy, compilation.
# Documentation : docs/operations/CI_CD.md
name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'apps/pouxis/src-tauri/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'apps/pouxis/src-tauri/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  TAURI_DIR: apps/pouxis/src-tauri

jobs:
  lint:
    name: fmt, clippy, check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Tauri project
        id: tauri
        run: |
          if [ -f "$TAURI_DIR/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rust ignoré::$TAURI_DIR/Cargo.toml n'existe pas encore."
          fi

      - name: Install Rust (stable)
        if: steps.tauri.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cheapest check first: no system dependencies needed.
      - name: cargo fmt --check
        if: steps.tauri.outputs.present == 'true'
        working-directory: ${{ env.TAURI_DIR }}
        run: cargo fmt --all --check

      - name: Install Tauri system dependencies
        if: steps.tauri.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        if: steps.tauri.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/pouxis/src-tauri -> target'

      # `tauri::generate_context!` needs `build.frontendDist` to exist at compile time; the web
      # bundle itself is irrelevant for lints, so a placeholder avoids building the frontend.
      - name: Placeholder frontend bundle
        if: steps.tauri.outputs.present == 'true'
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          dist=$(jq -r '.build.frontendDist // "../dist"' tauri.conf.json 2>/dev/null || echo "../dist")
          case "$dist" in http://* | https://*) exit 0 ;; esac
          mkdir -p "$dist"
          [ -e "$dist/index.html" ] || printf '<!doctype html><title>CI</title>\n' > "$dist/index.html"

      - name: cargo clippy
        if: steps.tauri.outputs.present == 'true'
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          locked=$([ -f Cargo.lock ] && echo --locked || true)
          cargo clippy --all-targets $locked -- -D warnings

      - name: cargo check
        if: steps.tauri.outputs.present == 'true'
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          locked=$([ -f Cargo.lock ] && echo --locked || true)
          cargo check --all-targets $locked

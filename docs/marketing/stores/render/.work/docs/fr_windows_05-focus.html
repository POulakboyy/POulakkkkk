      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: var(--font-sans);
        color: var(--ink);
        background: linear-gradient(
          180deg,
          var(--bg-elevated) 0%,
          var(--bg) 46%,
          var(--surface-2) 100%
        );
        -webkit-font-smoothing: antialiased;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.55em;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .eyebrow::before {
        content: '';
        width: 0.5em;
        height: 0.5em;
        border-radius: 50%;
        background: var(--accent);
      }
      .headline {
        font-family: var(--font-serif);
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -0.015em;
        color: var(--ink);
        text-wrap: balance;
      }
      .device {
        position: absolute;
      }
      .screen {
        position: absolute;
        overflow: hidden;
        background: var(--bg);
      }
      .screen > img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      .shadow {
        box-shadow:
          0 38.4px 134.4px rgb(var(--shadow-color) / 0.16),
          0 7.68px 23.04px rgb(var(--shadow-color) / 0.1);
